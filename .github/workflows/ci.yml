name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test
      - run: yarn manifest:check
      - name: Updater smoke test (installs this very commit into a temp folder)
        if: github.event_name == 'push'
        run: |
          mkdir -p /tmp/mp && cd /tmp/mp
          node $GITHUB_WORKSPACE/cli/index.js update main --dir sdk
          test -f sdk/index.js && cat sdk/VERSION

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub release from the tag
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: sdk/manifest.json
